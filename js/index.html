<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modular Web Flight Simulator</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0e;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .cockpit {
            width: 800px;
            background: #16161a;
            border: 4px solid #2a2a35;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            padding: 20px;
            box-sizing: border-box;
        }

        .windshield-container {
            position: relative;
            width: 100%;
            height: 300px;
            border: 2px solid #333344;
            background: #000;
            overflow: hidden;
            border-radius: 4px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hud-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }

        .dashboard {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            background: #111115;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #22222a;
        }

        .instrument {
            text-align: center;
            flex: 1;
            border-right: 1px solid #22222a;
        }

        .instrument:last-child {
            border-right: none;
        }

        .instrument label {
            font-size: 11px;
            color: #777788;
            display: block;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .instrument span {
            font-size: 20px;
            font-weight: bold;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 12px;
            color: #888899;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="cockpit">
        <!-- COCKPIT WINDOW / WINDSHIELD -->
        <div class="windshield-container">
            <canvas id="skyCanvas" width="760" height="300"></canvas>
            <div class="hud-overlay">
                <div>PITCH: <span id="hud-pitch">0</span>°</div>
                <div>STATUS: <span id="hud-status" style="color: #00ffcc;">GROUNDED</span></div>
            </div>
        </div>

        <!-- LIVE DASHBOARD -->
        <div class="dashboard">
            <div class="instrument">
                <label>AIRSPEED</label>
                <span id="val-speed">0</span> KTS
            </div>
            <div class="instrument">
                <label>ALTITUDE</label>
                <span id="val-alt">0</span> FT
            </div>
            <div class="instrument">
                <label>THROTTLE</label>
                <span id="val-throttle">0</span>%
            </div>
            <div class="instrument">
                <label>VERTICAL SPEED</label>
                <span id="val-vs">0</span> FT/M
            </div>
        </div>

        <div class="controls-hint">
            Controls: [W] / [S] Throttle Up/Down | [Arrow Up] / [Arrow Down] Pitch Nose
        </div>
    </div>

    <!-- MAIN GAME SCRIPT (Imports physics module) -->
    <script type="module">
        import { plane, updatePhysics } from './js/physics.js';

        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');

        // Track keyboard inputs
        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // Render the moving sky and ground on the canvas window
        function drawWindshieldView() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Horizon shifts up or down depending on pitch
            let horizonY = 150 + (plane.pitch * 4);

            // Sky
            ctx.fillStyle = "#10316b";
            ctx.fillRect(0, 0, canvas.width, horizonY);

            // Ground
            ctx.fillStyle = "#1e381e";
            ctx.fillRect(0, horizonY, canvas.width, canvas.height - horizonY);

            // Horizon Line
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            ctx.lineTo(canvas.width, horizonY);
            ctx.stroke();

            // Runway visual cue when close to ground
            if (plane.altitude < 500) {
                ctx.fillStyle = "#ffcc00";
                ctx.fillRect(canvas.width / 2 - 4, horizonY + 15, 8, 25);
            }
        }

        // Update HTML text elements with live physics data
        function updateUI() {
            document.getElementById('val-speed').innerText = Math.floor(plane.airspeed);
            document.getElementById('val-alt').innerText = Math.floor(plane.altitude);
            document.getElementById('val-throttle').innerText = Math.floor(plane.throttle);
            document.getElementById('val-vs').innerText = Math.floor(plane.verticalSpeed);
            document.getElementById('hud-pitch').innerText = Math.floor(plane.pitch);
            
            let statusEl = document.getElementById('hud-status');
            if (plane.altitude <= 0 && plane.throttle === 0) {
                statusEl.innerText = "PARKED / GROUNDED";
                statusEl.style.color = "#00ffcc";
            } else if (plane.altitude <= 0) {
                statusEl.innerText = "TOUCHDOWN";
                statusEl.style.color = "#ff3333";
            } else if (plane.airspeed < 60 && plane.altitude > 10) {
                statusEl.innerText = "STALL WARNING!";
                statusEl.style.color = "#ff3333";
            } else {
                statusEl.innerText = "AIRBORNE";
                statusEl.style.color = "#00ffcc";
            }
        }

        // Master Game Loop (Runs ~60 frames per second)
        function gameLoop() {
            updatePhysics(keys);
            drawWindshieldView();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        // Kick off the loop
        gameLoop();
    </script>

</body>
</html>
