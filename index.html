<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modular Web Flight Simulator</title>
    <!-- Stylesheet Modules -->
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/instrument.css">
    <style>
        /* Base Theme Styles */
        body {
            background-color: #0b0b0e;
            color: #00ffcc;
        }
        .cockpit {
            background: #16161a;
            border: 4px solid #2a2a35;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            border-radius: 8px;
        }
        .windshield-container {
            border: 2px solid #333344;
            background: #000;
        }
        .controls-hint {
            font-size: 12px;
            color: #888899;
        }
    </style>
</head>
<body>

    <div class="cockpit">
        <!-- COCKPIT WINDOW / WINDSHIELD -->
        <div class="windshield-container">
            <canvas id="skyCanvas" width="760" height="300"></canvas>
            <div class="hud-overlay">
                <div>PITCH: <span id="hud-pitch">0</span>°</div>
                <div>STATUS: <span id="hud-status" style="color: #00ffcc;">GROUNDED</span></div>
            </div>
        </div>

        <!-- LIVE DASHBOARD -->
        <div class="dashboard">
            <div class="instrument">
                <label>AIRSPEED</label>
                <span id="val-speed">0</span> KTS
            </div>
            <div class="instrument">
                <label>ALTITUDE</label>
                <span id="val-alt">0</span> FT
            </div>
            <div class="instrument">
                <label>THROTTLE</label>
                <span id="val-throttle">0</span>%
            </div>
            <div class="instrument">
                <label>VERTICAL SPEED</label>
                <span id="val-vs">0</span> FT/M
            </div>
        </div>

        <div class="controls-hint">
            Controls: [W] / [S] Throttle Up/Down | [Arrow Up] / [Arrow Down] Pitch Nose
        </div>
    </div>

    <!-- Main JavaScript Module -->
    <script type="module" src="./js/main.js"></script>

</body>
</html>
