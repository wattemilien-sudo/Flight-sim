<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modular Web Flight Simulator</title>
    <!-- Imports the structural layout stylesheet -->
    <link rel="stylesheet" href="./css/layout.css">
    <style>
        /* Visual Theme Overlays (Can later be moved to a theme.css file) */
        body {
            background-color: #0b0b0e;
            color: #00ffcc;
        }
        .cockpit {
            background: #16161a;
            border: 4px solid #2a2a35;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            border-radius: 8px;
        }
        .windshield-container {
            border: 2px solid #333344;
            background: #000;
        }
        .hud-overlay {
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
        }
        .dashboard {
            background: #111115;
            border: 1px solid #22222a;
        }
        .instrument {
            border-right: 1px solid #22222a;
        }
        .instrument:last-child {
            border-right: none;
        }
        .instrument label {
            font-size: 11px;
            color: #777788;
            letter-spacing: 1px;
        }
        .instrument span {
            font-size: 20px;
            font-weight: bold;
        }
        .controls-hint {
            font-size: 12px;
            color: #888899;
        }
    </style>
</head>
<body>

    <div class="cockpit">
        <!-- COCKPIT WINDOW / WINDSHIELD -->
        <div class="windshield-container">
            <canvas id="skyCanvas" width="760" height="300"></canvas>
            <div class="hud-overlay">
                <div>PITCH: <span id="hud-pitch">0</span>°</div>
                <div>STATUS: <span id="hud-status" style="color: #00ffcc;">GROUNDED</span></div>
            </div>
        </div>

        <!-- LIVE DASHBOARD -->
        <div class="dashboard">
            <div class="instrument">
                <label>AIRSPEED</label>
                <span id="val-speed">0</span> KTS
            </div>
            <div class="instrument">
                <label>ALTITUDE</label>
                <span id="val-alt">0</span> FT
            </div>
            <div class="instrument">
                <label>THROTTLE</label>
                <span id="val-throttle">0</span>%
            </div>
            <div class="instrument">
                <label>VERTICAL SPEED</label>
                <span id="val-vs">0</span> FT/M
            </div>
        </div>

        <div class="controls-hint">
            Controls: [W] / [S] Throttle Up/Down | [Arrow Up] / [Arrow Down] Pitch Nose
        </div>
    </div>

    <!-- Imports the main JavaScript module -->
    <script type="module" src="./js/main.js"></script>

</body>
</html>
